<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPORTS.IA - Criar Conta</title>
    <link rel="icon" type="image/png" href="Xiko_Store__3_-removebg-preview.png">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="notifications.css">

</head>
<body>
    <div class="container">
        <header>
            <h1>SPORTS.IA</h1>
            <p>Crie sua conta</p>
        </header>

        <main>
            <section class="input-section">
                <div class="text-container login-container">
                    <h2>Criar Conta</h2>
                    <input type="email" id="email" placeholder="Seu email" class="text-input">
                    <input type="text" id="cpf" placeholder="Seu CPF" class="text-input" maxlength="14">
                    <input type="password" id="password" placeholder="Sua senha" class="text-input">
                    <input type="password" id="confirm-password" placeholder="Confirme sua senha" class="text-input">
                    <div class="checkbox-container">
                        <input type="checkbox" id="age-confirm" class="checkbox-input">
                        <label for="age-confirm">Confirmo que sou maior de 18 anos</label>
                    </div>
                    <button class="submit-button" onclick="register()">Criar Conta</button>
                    <div class="login-links">
                        <a href="index.html" class="back-to-login">Voltar para Login</a>
                    </div>
                </div>
            </section>
        </main>

        <footer>
            <p>© 2025 Todos os direitos reservados.</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
