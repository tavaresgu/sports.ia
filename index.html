<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPORTS.IA - Login</title>
    <link rel="icon" type="image/png" href="Xiko_Store__3_-removebg-preview.png">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="notifications.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>SPORTS.IA</h1>
            <p>Acesse sua conta</p>
        </header>

        <main>
            <section class="input-section">
                <div class="text-container login-container">
                    <h2>Login</h2>
                    <input type="email" id="email" placeholder="Seu email/CPF" class="text-input">
                    <input type="password" id="password" placeholder="Sua senha" class="text-input">
                    <button class="submit-button" onclick="login()">Entrar</button>
                    <div class="login-links">
                        <a href="register.html" class="create-account" style="margin: 0 auto;">Criar conta</a>
                    </div>
                </div>
            </section>
        </main>

        <footer>
            <p>© 2025 Todos os direitos reservados.</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
